name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Har 6 ghante — naye approved tutors static pages par aa jayein.
    - cron: '0 */6 * * *'
  # Admin panel ka "Rebuild now" button isay trigger karta hai.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Firestore se data lao
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/fetch-data.mjs

      - name: Build
        env:
          PUBLIC_FIREBASE_API_KEY:     ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID:  ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_SENDER_ID:   ${{ secrets.PUBLIC_FIREBASE_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID:      ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_RECAPTCHA_SITE_KEY:   ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_GTM_ID:               ${{ secrets.PUBLIC_GTM_ID }}
          PUBLIC_GA4_ID:               ${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_META_PIXEL_ID:        ${{ secrets.PUBLIC_META_PIXEL_ID }}
          PUBLIC_CLOUDINARY_CLOUD:     ${{ secrets.PUBLIC_CLOUDINARY_CLOUD }}
          PUBLIC_CLOUDINARY_PRESET:    ${{ secrets.PUBLIC_CLOUDINARY_PRESET }}
          # Contact page aur admin ka rebuild button — in ke bagair wo pages
          # bante to hain, magar khali/disabled rehte hain.
          PUBLIC_CONTACT_EMAIL:        ${{ secrets.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_OFFICIAL_WHATSAPP:    ${{ secrets.PUBLIC_OFFICIAL_WHATSAPP }}
          PUBLIC_GITHUB_REPO:          ${{ secrets.PUBLIC_GITHUB_REPO }}
          PUBLIC_GITHUB_WORKFLOW:      deploy.yml
        run: npm run build

      - name: SEO gate — thin pages aur phone leaks block karo
        env:
          PUBLIC_OFFICIAL_WHATSAPP: ${{ secrets.PUBLIC_OFFICIAL_WHATSAPP }}
        run: node scripts/validate-seo.mjs
        # 3 se kam tutors wala page, ya kisi page ke source mein phone number
        # mila, to yahan build TOOT jayegi. Ye jaan boojh kar hai.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

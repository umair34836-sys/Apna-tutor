name: Firestore rules aur indexes deploy

# ─────────────────────────────────────────────────────────────────────────────
# Rules aur indexes Firestore par "deploy" karni parti hain — repo mein hone se
# kuch nahi hota. Ye workflow isi liye hai, taake ye kaam bina Firebase CLI
# install kiye ho jaye:
#
#   GitHub → Actions → "Firestore rules aur indexes deploy" → Run workflow
#
# Indexes na hon to har wo query fail hoti hai jismein where + orderBy hai —
# yani search, leads, dashboards aur admin ki saari lists. Site par wo
# "Database ka setup abhi mukammal nahi hua" ke taur par dikhta hai.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/firestore.yml'

permissions:
  contents: read

concurrency:
  group: firestore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Push sirf default branch se deploy kare; manual run hamesha chale.
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Service account check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            case "$FIREBASE_SERVICE_ACCOUNT" in
              \{*) ;;
              *) echo "::warning::Secret '{' se shuru nahi hota — shayad poora JSON copy nahi hua." ;;
            esac
            exit 0
          fi

          # Secret mojood na ho to sab se kaam ki baat ye NAHI hai ke "set nahi
          # hai" — wo to banda dekh hi raha hai. Kaam ki baat ye hai ke wo kis
          # GHALAT jagah ja sakti hai. GitHub par secrets ki chaar alag alag
          # jagahein hain aur teen bilkul aisi hi dikhti hain.
          echo "::error::FIREBASE_SERVICE_ACCOUNT is repo ki ACTIONS secrets mein nahi hai."
          echo ""
          echo "Sahi jagah sirf ye page hai:"
          echo ""
          echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo ""
          echo "Us page par 'Repository secrets' ki list mein FIREBASE_SERVICE_ACCOUNT"
          echo "likha nazar aana chahiye."
          echo ""
          echo "Ye chaaron jagahein ek jaisi dikhti hain, magar workflow ko sirf"
          echo "pehli wali nazar aati hai:"
          echo ""
          echo "  ✓ Repo → Settings → Secrets and variables → ACTIONS → Secrets"
          echo "  ✗ usi page ka VARIABLES tab"
          echo "  ✗ AGENTS / Codespaces / Dependabot ki secrets"
          echo "  ✗ 'New environment secret' (sirf us environment ko milti hai)"
          echo "  ✗ apni account settings (avatar → Settings) ki secrets"
          echo ""
          echo "Chabi abhi banani ho to: Firebase Console → Project settings →"
          echo "Service accounts → Generate new private key. Us JSON ka POORA text"
          echo "({ se } tak) upar wale page par 'New repository secret' mein paste"
          echo "karein, naam bilkul: FIREBASE_SERVICE_ACCOUNT"
          exit 1

      - name: Credentials file banao
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Runner ki apni disk par — repo mein kabhi nahi.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          # Project id wahi jo service account ka hai — hardcode karne se
          # ghalat project par deploy hone ka khatra rehta hai.
          node -e "
            let sa;
            try { sa = require(process.env.RUNNER_TEMP + '/sa.json'); }
            catch { console.error('::error::FIREBASE_SERVICE_ACCOUNT valid JSON nahi hai. Poori file paste karein — { se } tak.'); process.exit(1); }
            if (!sa.project_id) { console.error('::error::Service account JSON mein project_id nahi hai.'); process.exit(1); }
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'FIREBASE_PROJECT=' + sa.project_id + '\n');
            console.log('Project:      ', sa.project_id);
            // Ye email IAM mein dhoondna parta hai agar deploy permission par ruk jaye.
            console.log('Service acct: ', sa.client_email || '(nahi mila)');
          "

      - name: Rules aur indexes deploy karo
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT" \
            --non-interactive
          code=$?
          set -e

          if [ $code -ne 0 ]; then
            echo "::error::Deploy fail hui."
            echo ""
            echo "Agar upar 'permission' ya 'PERMISSION_DENIED' likha hai, to service"
            echo "account ke paas ye do roles nahi hain. Ek baar dena parta hai:"
            echo ""
            echo "  console.cloud.google.com  →  IAM & Admin  →  IAM"
            echo "  upar wale step mein jo 'Service acct' email chhapa hai usay dhoondein"
            echo "  Edit (pencil)  →  Add another role  →  ye do add karein:"
            echo "     • Firebase Rules Admin"
            echo "     • Cloud Datastore Index Admin"
            echo ""
            echo "Phir ye workflow dobara chalayein."
            exit $code
          fi

      - name: Credentials mitao
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
